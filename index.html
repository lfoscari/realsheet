<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>D&D Character sheet</title>

        <!-- Primary Meta Tags -->
        <meta name="title" content="D&D Character sheet" />
        <meta
            name="description"
            content="Just a simple, no-fuss website to quickly make a D&D character sheet and share it with your party."
        />
        <link rel="canonical" href="https://lfoscari.github.io/realsheet/" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta
            property="og:url"
            content="https://lfoscari.github.io/realsheet/"
        />
        <meta property="og:title" content="D&D Character sheet" />
        <meta
            property="og:description"
            content="Just a simple, no-fuss website to quickly make a D&D character sheet and share it with your party."
        />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta
            property="twitter:url"
            content="https://lfoscari.github.io/realsheet/"
        />
        <meta property="twitter:title" content="D&D Character sheet" />
        <meta
            property="twitter:description"
            content="Just a simple, no-fuss website to quickly make a D&D character sheet and share it with your party."
        />

        <link href="./src/output.css" rel="stylesheet" />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
    </head>

    <body
        x-data="sheet"
        class="text-[18px] max-w-[60em] mx-auto bg-black text-white p-5 md:p-10 grid grid-cols-1 md:grid-cols-2 gap-20"
        x-on:input.debounce="onDataChange"
        x-on:change.debounce="onDataChange"
    >
        <fieldset class="grid grid-cols-2 items-center gap-3">
            <h2 class="col-span-2">Character</h2>

            <label>Name:</label>
            <input
                x-model="name"
                name="name"
                type="text"
                placeholder="Character Name"
            />

            <label>Class & Level:</label>
            <input
                x-model="classLevel"
                type="text"
                placeholder="Class & Level"
            />

            <label>Background:</label>
            <input x-model="background" type="text" placeholder="Background" />

            <label>Player Name:</label>
            <input x-model="playerName" type="text" placeholder="Player Name" />

            <label>Race:</label>
            <input x-model="race" type="text" placeholder="Race" />

            <label>Alignment:</label>
            <select x-model="alignment">
                <option value="">Select Alignment...</option>
                <option value="LG">Lawful Good</option>
                <option value="NG">Neutral Good</option>
                <option value="CG">Chaotic Good</option>
                <option value="LN">Lawful Neutral</option>
                <option value="N">True Neutral</option>
                <option value="CN">Chaotic Neutral</option>
                <option value="LE">Lawful Evil</option>
                <option value="NE">Neutral Evil</option>
                <option value="CE">Chaotic Evil</option>
            </select>

            <h2 class="col-span-2"></h2>

            <label>Experience Points:</label>
            <input x-model="xp" type="number" min="0" placeholder="XP" />

            <label>Inspirations:</label>
            <input x-model="inspirations" type="number" min="0" />
            <label>Proficiency Bonus:</label>
            <input x-model="proficiencyBonus" type="number" min="0" />
            <label>Passive Wisdom:</label>
            <input x-model="passivePerception" type="number" min="0" />

            <h2 class="col-span-2"></h2>
            <h2 class="col-span-2">Combat</h2>

            <label>Armor Class:</label>
            <input x-model="ac" type="number" min="0" />
            <label>Initiative:</label>
            <input x-model="initiative" type="number" min="0" />
            <label>Speed:</label>
            <input x-model="speed" type="number" min="0" />
            <label>Hit Point Maximum:</label>
            <input x-model="hpMax" type="number" min="0" />
            <label>Current Hit Points:</label>
            <input x-model="hpCurrent" type="number" min="0" />
            <label>Temporary Hit Points:</label>
            <input x-model="hpTemp" type="number" min="0" />
            <label>Hit Dice Total:</label>
            <input x-model="hitDiceTotal" type="text" />
            <label>Hit Dice Current:</label>
            <input x-model="hitDiceCurrent" type="text" />

            <h2 class="col-span-2"></h2>
            <h2 class="col-span-2">Death Saves</h2>

            <label>Successes:</label>
            <div>
                <input type="checkbox" x-model="deathSaves.success1" />
                <input type="checkbox" x-model="deathSaves.success2" />
                <input type="checkbox" x-model="deathSaves.success3" />
            </div>

            <label>Failures:</label>
            <div>
                <input type="checkbox" x-model="deathSaves.fail1" />
                <input type="checkbox" x-model="deathSaves.fail2" />
                <input type="checkbox" x-model="deathSaves.fail3" />
            </div>
        </fieldset>

        <fieldset class="grid grid-cols-[2fr_auto_auto] gap-5">
            <template x-for="attr in attributes" :key="attr.name">
                <div class="grid col-span-3 grid-cols-subgrid items-center">
                    <h2 x-text="attr.name"></h2>
                    <div>
                        <label>Score:</label>
                        <input
                            class="w-20"
                            x-model="attr.score"
                            type="number"
                            min="0"
                        />
                    </div>
                    <label> (<span x-text="attrModifier(attr)"></span>) </label>

                    <div class="col-span-3">
                        <input
                            x-model="attr.savingThrowProficiency"
                            type="checkbox"
                        />
                        <small>Saving throw proficiency</small>
                    </div>

                    <template x-for="skill in attr.skills" :key="skill.name">
                        <div class="grid grid-cols-subgrid col-span-3">
                            <div class="col-span-2">
                                <input
                                    x-model="skill.proficiency"
                                    type="checkbox"
                                    alt="proficiency"
                                />
                                <input
                                    x-model="skill.expertise"
                                    type="checkbox"
                                    alt="expertise"
                                />
                                <span
                                    x-text="skill.name"
                                    class="inline-block w-36"
                                ></span>
                            </div>
                            <label
                                >(<span
                                    x-text="skillModifier(attr, skill)"
                                ></span
                                >)</label
                            >
                        </div>
                    </template>
                </div>
            </template>
        </fieldset>

        <fieldset class="col-span-1 md:col-span-2 flex flex-col gap-5">
            <div>
                <h2>Attacks & Spellcasting</h2>
                <textarea
                    x-model="attacks"
                    rows="5"
                    cols="50"
                    placeholder="Weapon Name | Atk Bonus | Damage/Type..."
                ></textarea>
            </div>
            <div>
                <h2>Personality Traits:</h2>
                <textarea
                    x-model="personalityTraits"
                    rows="3"
                    cols="50"
                    class="p-2 w-full"
                ></textarea>
            </div>
            <div class="flex gap-5">
                <div>
                    <h2>Ideals</h2>
                    <textarea
                        x-model="ideals"
                        rows="3"
                        cols="50"
                        class="p-2 w-full"
                    ></textarea>
                </div>
                <div>
                    <h2>Bonds</h2>
                    <textarea
                        x-model="bonds"
                        rows="3"
                        cols="50"
                        class="p-2 w-full"
                    ></textarea>
                </div>
                <div>
                    <h2>Flaws</h2>
                    <textarea
                        x-model="flaws"
                        rows="3"
                        cols="50"
                        class="p-2 w-full"
                    ></textarea>
                </div>
            </div>
            <div>
                <h2>Features & Traits</h2>
                <textarea
                    x-model="featuresTraits"
                    rows="6"
                    cols="50"
                    placeholder="List of features and traits..."
                ></textarea>
            </div>
            <div>
                <h2>Other Proficiencies & Languages</h2>
                <textarea
                    x-model="proficiencies"
                    rows="5"
                    cols="50"
                    placeholder="Languages, tool proficiencies, etc."
                ></textarea>
            </div>

            <div>
                <h2>Equipment</h2>
                <div class="flex flex-wrap justify-around">
                    <div>
                        <label>CP:</label>
                        <input
                            class="w-26"
                            x-model="coins.cp"
                            type="number"
                            min="0"
                        />
                    </div>
                    <div>
                        <label>SP:</label>
                        <input
                            class="w-26"
                            x-model="coins.sp"
                            type="number"
                            min="0"
                        />
                    </div>
                    <div>
                        <label>EP:</label>
                        <input
                            class="w-26"
                            x-model="coins.ep"
                            type="number"
                            min="0"
                        />
                    </div>
                    <div>
                        <label>GP:</label>
                        <input
                            class="w-26"
                            x-model="coins.gp"
                            type="number"
                            min="0"
                        />
                    </div>
                    <div>
                        <label>PP:</label>
                        <input
                            class="w-26"
                            x-model="coins.pp"
                            type="number"
                            min="0"
                        />
                    </div>
                </div>
                <textarea
                    x-model="equipment"
                    rows="6"
                    cols="50"
                    placeholder="Backpack contents, armor, etc."
                ></textarea>
            </div>

            <div class="flex flex-wrap justify-around md:items-center gap-3">
                <!-- <a x-on:click="info()" class="text-gray-500 cursor-pointer m-auto">Information</a> -->
                <p class="text-gray-500">The character sheet is saved in the URL, feel free to share it or to check the browser history for old ones.</p>
                <a
                    x-on:click="reset()"
                    class="px-3 py-1 hover:border-gray-500 border border-transparent rounded-md text-gray-500 cursor-pointer"
                    >⌦ Clear</a
                >
            </div>
        </fieldset>

        <script>
            document.addEventListener("alpine:init", () => {
                Alpine.data("sheet", () => ({
                    name: "",
                    classLevel: "",
                    background: "",
                    playerName: "",
                    race: "",
                    alignment: "",
                    xp: 0,

                    attributes: [
                        {
                            name: "Strength",
                            score: 10,
                            savingThrowProficienty: false,
                            skills: [
                                {
                                    name: "Athletics",
                                    proficiency: false,
                                    expertise: false,
                                },
                            ],
                        },
                        {
                            name: "Dexterity",
                            score: 10,
                            savingThrowProficienty: false,
                            skills: [
                                {
                                    name: "Acrobatics",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Sleight of Hand",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Stealth",
                                    proficiency: false,
                                    expertise: false,
                                },
                            ],
                        },
                        {
                            name: "Constitution",
                            score: 10,
                            savingThrowProficienty: false,
                        },
                        {
                            name: "Intelligence",
                            score: 10,
                            savingThrowProficienty: false,
                            skills: [
                                {
                                    name: "Arcana",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "History",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Investigation",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Nature",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Religion",
                                    proficiency: false,
                                    expertise: false,
                                },
                            ],
                        },
                        {
                            name: "Wisdom",
                            score: 10,
                            savingThrowProficienty: false,
                            skills: [
                                {
                                    name: "Animal Handling",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Insight",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Medicine",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Perception",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Survival",
                                    proficiency: false,
                                    expertise: false,
                                },
                            ],
                        },
                        {
                            name: "Charisma",
                            score: 10,
                            savingThrowProficienty: false,
                            skills: [
                                {
                                    name: "Deception",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Intimidation",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Performance",
                                    proficiency: false,
                                    expertise: false,
                                },
                                {
                                    name: "Persuasion",
                                    proficiency: false,
                                    expertise: false,
                                },
                            ],
                        },
                    ],

                    inspirations: 0,
                    proficiencyBonus: 2,
                    passivePerception: 10,

                    ac: 10,
                    initiative: 0,
                    speed: 30,

                    hpMax: 0,
                    hpCurrent: 0,
                    hpTemp: 0,
                    hitDiceTotal: "",
                    hitDiceCurrent: "",

                    deathSaves: {
                        success1: false,
                        success2: false,
                        success3: false,
                        fail1: false,
                        fail2: false,
                        fail3: false,
                    },

                    attacks: "",
                    personalityTraits: "",
                    ideals: "",
                    bonds: "",
                    flaws: "",
                    featuresTraits: "",
                    proficiencies: "",

                    coins: { cp: 0, sp: 0, ep: 0, gp: 0, pp: 0 },
                    equipment: "",

                    attrModifier(attr) {
                        if (attr.score < 10)
                            return Math.ceil((attr.score - 10) / 2);
                        return Math.floor((attr.score - 10) / 2);
                    },

                    skillModifier(attr, skill) {
                        return (
                            this.attrModifier(attr) +
                            (skill.proficiency ? this.proficiencyBonus : 0) +
                            (skill.expertise ? this.proficiencyBonus : 0)
                        );
                    },

                    updateTitle() {
                        document.title =
                            this.name.trim() == ""
                                ? "D&D Character sheet"
                                : this.name.trim();
                    },

                    init() {
                        // Get sheet from URL parameters
                        const urlData = this.deserializeFromURI();

                        // Load sheet into memory
                        console.log("Loading", urlData);
                        for (const key in urlData) this[key] = urlData[key];

                        // Update page title with character's name
                        this.updateTitle();
                        this.$watch("name", () => this.updateTitle());
                    },

                    reset() {
                        // Reload page removing the pararmeters
                        location.href = window.location.pathname;
                    },

                    serializeToURI(obj, prefix = "") {
                        const parts = [];

                        for (const key in obj) {
                            if (
                                Object.prototype.hasOwnProperty.call(obj, key)
                            ) {
                                const value = obj[key];
                                const constructKey = prefix
                                    ? `${prefix}[${key}]`
                                    : key;

                                if (
                                    value !== null &&
                                    typeof value === "object"
                                ) {
                                    parts.push(
                                        this.serializeToURI(
                                            value,
                                            constructKey,
                                        ),
                                    );
                                } else if (value !== undefined) {
                                    parts.push(
                                        encodeURIComponent(constructKey) +
                                            "=" +
                                            encodeURIComponent(value),
                                    );
                                }
                            }
                        }

                        return parts.join("&");
                    },

                    deserializeFromURI() {
                        const params = new URLSearchParams(
                            window.location.search,
                        );
                        const obj = {};

                        for (const [key, value] of params) {
                            // Splits "user[meta][id]" into ["user", "meta", "id"]
                            const keys = key.match(/[^[\]]+/g);

                            keys.reduce((acc, k, i) => {
                                if (i === keys.length - 1) {
                                    if (value.toLowerCase() === "true") {
                                        acc[k] = true;
                                    } else if (
                                        value.toLowerCase() === "false"
                                    ) {
                                        acc[k] = false;
                                    } else {
                                        // Fallback to Number if numeric, otherwise keep string
                                        acc[k] =
                                            isNaN(value) || value.trim() === ""
                                                ? value
                                                : Number(value);
                                    }
                                } else {
                                    if (!acc[k]) {
                                        // Lookahead: if the next key is a digit, initialize an array
                                        acc[k] = !isNaN(keys[i + 1]) ? [] : {};
                                    }
                                }
                                return acc[k];
                            }, obj);
                        }
                        return obj;
                    },

                    /* serializeToURI(obj) {
                        const json = JSON.stringify(obj);
                        const base64 = btoa(encodeURIComponent(json));

                        // 3. Make it URL-safe (replace + / =)
                        return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                    },

                    deserializeFromURI() {
                        const params = new URLSearchParams(window.location.search);
                        const compressed = params.get('_state');

                        if (!compressed) return {};

                        try {
                            // 1. Restore Base64 padding and characters
                            let base64 = compressed.replace(/-/g, '+').replace(/_/g, '/');
                            while (base64.length % 4) base64 += '=';

                            // 2. Decode and Parse
                            const json = decodeURIComponent(atob(base64));
                            return JSON.parse(json);
                        } catch (e) {
                            console.error("Failed to decompress URL state", e);
                            return {};
                        }
                    }, */

                    onDataChange(event) {
                        const sheet = JSON.parse(JSON.stringify(this));

                        // Remove data change event entry
                        delete sheet["$event"];

                        console.log("Sheet changed, saving!", sheet);

                        const queryString = this.serializeToURI(sheet);

                        // Construct the new URL path
                        const newRelativePathQuery =
                            window.location.pathname + "?" + queryString;

                        // Update the browser address bar without reloading the page
                        history.replaceState(null, "", newRelativePathQuery);
                    },
                }));
            });
        </script>
    </body>
</html>
